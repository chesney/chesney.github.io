<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="170 245 680 532" width="680" height="532">
  <defs>
    <linearGradient id="goldBaseMono" x1="12%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#F6E297"/>
      <stop offset="25%" stop-color="#DFB858"/>
      <stop offset="50%" stop-color="#F7E5A0"/>
      <stop offset="78%" stop-color="#DFB858"/>
      <stop offset="100%" stop-color="#C29636"/>
    </linearGradient>

    <linearGradient id="bevelStrokeMono" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C8" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#D9B150" stop-opacity="0.15"/>
      <stop offset="65%" stop-color="#704F0F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4A3205" stop-opacity="0.95"/>
    </linearGradient>

    <path id="leftCMono" d="M 640.60 484.00 A 222 241 0 1 0 640.60 538.00 L 566.05 538.00 A 148 167 0 1 1 566.05 484.00 Z"/>
    <path id="rightCMono" d="M 820.03 447.00 A 222 241 0 1 0 820.03 575.00 L 742.70 575.00 A 148 167 0 1 1 742.70 447.00 Z"/>

    <clipPath id="topHalfMono">
      <rect x="0" y="0" width="1024" height="511"/>
    </clipPath>
    <clipPath id="botHalfMono">
      <rect x="0" y="511" width="1024" height="513"/>
    </clipPath>

    <mask id="maskLeftMono">
      <rect width="1024" height="1024" fill="white"/>
      <g clip-path="url(#topHalfMono)">
        <use href="#rightCMono" fill="black" stroke="black" stroke-width="20" stroke-linejoin="round"/>
      </g>
    </mask>

    <mask id="maskRightMono">
      <rect width="1024" height="1024" fill="white"/>
      <g clip-path="url(#botHalfMono)">
        <use href="#leftCMono" fill="black" stroke="black" stroke-width="20" stroke-linejoin="round"/>
      </g>
    </mask>

    <clipPath id="clipLeftMono">
      <use href="#leftCMono"/>
    </clipPath>
    <clipPath id="clipRightMono">
      <use href="#rightCMono"/>
    </clipPath>
  </defs>

  <g>
    <g mask="url(#maskLeftMono)">
      <g clip-path="url(#clipLeftMono)">
        <use href="#leftCMono" fill="url(#goldBaseMono)"/>
        <use href="#leftCMono" fill="none" stroke="url(#bevelStrokeMono)" stroke-width="10" stroke-linejoin="miter"/>
      </g>
    </g>

    <g mask="url(#maskRightMono)">
      <g clip-path="url(#clipRightMono)">
        <use href="#rightCMono" fill="url(#goldBaseMono)"/>
        <use href="#rightCMono" fill="none" stroke="url(#bevelStrokeMono)" stroke-width="10" stroke-linejoin="miter"/>
      </g>
    </g>
  </g>
</svg>
