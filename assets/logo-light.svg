<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Warm Ivory Background matching reference -->
    <radialGradient id="bgLight" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#FAF7F1"/>
      <stop offset="100%" stop-color="#F6F3EB"/>
    </radialGradient>

    <!-- Brushed Metallic Gold Surface -->
    <linearGradient id="goldBaseLight" x1="12%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#F6E297"/>
      <stop offset="25%" stop-color="#DFB858"/>
      <stop offset="50%" stop-color="#F7E5A0"/>
      <stop offset="78%" stop-color="#DFB858"/>
      <stop offset="100%" stop-color="#C29636"/>
    </linearGradient>

    <!-- Subtle Horizontal Brushed Metal Sheen -->
    <pattern id="brushedSheenLight" width="200" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="200" y2="1" stroke="#FFF6D1" stroke-opacity="0.09" stroke-width="1"/>
      <line x1="0" y1="3" x2="200" y2="3" stroke="#5A3F0A" stroke-opacity="0.08" stroke-width="1"/>
      <line x1="0" y1="5" x2="200" y2="5" stroke="#FFF6D1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- 3D Bevel Edge Highlight & Shadow -->
    <linearGradient id="bevelStrokeLight" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C8" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#D9B150" stop-opacity="0.15"/>
      <stop offset="65%" stop-color="#704F0F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4A3205" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Exact C Paths -->
    <path id="leftCLight" d="M 640.60 484.00 A 222 241 0 1 0 640.60 538.00 L 566.05 538.00 A 148 167 0 1 1 566.05 484.00 Z"/>
    <path id="rightCLight" d="M 820.03 447.00 A 222 241 0 1 0 820.03 575.00 L 742.70 575.00 A 148 167 0 1 1 742.70 447.00 Z"/>

    <!-- Top / Bottom Half Clips for Interlocking -->
    <clipPath id="topHalfLight">
      <rect x="0" y="0" width="1024" height="511"/>
    </clipPath>
    <clipPath id="botHalfLight">
      <rect x="0" y="511" width="1024" height="513"/>
    </clipPath>

    <!-- Interlocking Masks (10px clean gap) -->
    <mask id="maskLeftLight">
      <rect width="1024" height="1024" fill="white"/>
      <g clip-path="url(#topHalfLight)">
        <use href="#rightCLight" fill="black" stroke="black" stroke-width="20" stroke-linejoin="round"/>
      </g>
    </mask>

    <mask id="maskRightLight">
      <rect width="1024" height="1024" fill="white"/>
      <g clip-path="url(#botHalfLight)">
        <use href="#leftCLight" fill="black" stroke="black" stroke-width="20" stroke-linejoin="round"/>
      </g>
    </mask>

    <!-- Inner Bevel Clips -->
    <clipPath id="clipLeftLight">
      <use href="#leftCLight"/>
    </clipPath>
    <clipPath id="clipRightLight">
      <use href="#rightCLight"/>
    </clipPath>

    <!-- Soft Realistic Drop Shadow for Light Canvas -->
    <filter id="dropShadowLight" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2B2110" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2B2110" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1024" height="1024" fill="url(#bgLight)"/>

  <!-- Interlocking CC Monogram -->
  <g filter="url(#dropShadowLight)">
    <!-- Left C (Masked at top overlap) -->
    <g mask="url(#maskLeftLight)">
      <g clip-path="url(#clipLeftLight)">
        <use href="#leftCLight" fill="url(#goldBaseLight)"/>
        <use href="#leftCLight" fill="url(#brushedSheenLight)"/>
        <use href="#leftCLight" fill="none" stroke="url(#bevelStrokeLight)" stroke-width="10" stroke-linejoin="miter"/>
      </g>
    </g>

    <!-- Right C (Masked at bottom overlap) -->
    <g mask="url(#maskRightLight)">
      <g clip-path="url(#clipRightLight)">
        <use href="#rightCLight" fill="url(#goldBaseLight)"/>
        <use href="#rightCLight" fill="url(#brushedSheenLight)"/>
        <use href="#rightCLight" fill="none" stroke="url(#bevelStrokeLight)" stroke-width="10" stroke-linejoin="miter"/>
      </g>
    </g>
  </g>
</svg>
