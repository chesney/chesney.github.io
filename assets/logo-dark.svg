<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Charcoal Background -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>

    <!-- Brushed Metallic Gold Gradients -->
    <linearGradient id="goldLeft" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F9E7A1"/>
      <stop offset="22%" stop-color="#DFB64E"/>
      <stop offset="48%" stop-color="#FFF2BD"/>
      <stop offset="72%" stop-color="#C49626"/>
      <stop offset="100%" stop-color="#966E14"/>
    </linearGradient>

    <linearGradient id="goldRight" x1="80%" y1="12%" x2="20%" y2="88%">
      <stop offset="0%" stop-color="#FCECB2"/>
      <stop offset="28%" stop-color="#D4AF37"/>
      <stop offset="54%" stop-color="#F5DC87"/>
      <stop offset="78%" stop-color="#B6881E"/>
      <stop offset="100%" stop-color="#87610E"/>
    </linearGradient>

    <!-- 3D Bevel Edge Highlight -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#4D3504" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Soft Realistic Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Interlocking Overlap Shadow -->
    <filter id="overlapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Square Charcoal Canvas -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Interlocking CC Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Left C -->
    <path d="M 488 274
             A 240 240 0 1 0 488 750
             L 456 676
             A 160 160 0 1 1 456 348
             Z"
          fill="url(#goldLeft)" stroke="url(#goldBevel)" stroke-width="3"/>

    <!-- Right C (Upper & Lower Interlocking Arcs) -->
    <g filter="url(#overlapShadow)">
      <path d="M 812 436
               A 240 240 0 0 0 364 468
               L 442 468
               A 160 160 0 0 1 732 436
               Z"
            fill="url(#goldRight)" stroke="url(#goldBevel)" stroke-width="3"/>

      <path d="M 364 556
               A 240 240 0 0 0 812 588
               L 732 588
               A 160 160 0 0 1 442 556
               Z"
            fill="url(#goldRight)" stroke="url(#goldBevel)" stroke-width="3"/>
    </g>
  </g>
</svg>
